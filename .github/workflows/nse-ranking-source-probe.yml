name: Resolve official NSE historical ranking
on:
  push:
    branches: [research-v2]
    paths:
      - 'research_v2/source_probe.py'
      - '.github/workflows/nse-ranking-source-probe.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Inspect official NSE archived listing
        run: python -m research_v2.source_probe
