name: Research v2 validation
on:
  push:
    branches: [research-v2]
  pull_request:
    paths: ['research_v2/**', 'tests/**', 'requirements-v2.txt', '.github/workflows/research-v2-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -r requirements-v2.txt
      - name: Run tests
        run: python -m pytest -q tests
